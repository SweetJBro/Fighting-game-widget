# Runs on GitHub Actions and on Forgejo Actions (nether.codes reads .github/workflows too).
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned EmulatorJS (for the internals check)
        run: scripts/fetch-emulatorjs.sh
      - name: Syntax check
        run: for f in web/js/*.js server/*.js bot/*.mjs scripts/*.mjs; do node --check "$f"; done
      - name: Tests
        run: npm test
      - name: romset.py self-check
        run: python3 -I scripts/romset.py --help > /dev/null
