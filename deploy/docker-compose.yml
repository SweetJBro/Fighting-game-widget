# Production layout: Caddy terminates TLS for two hostnames.
#   LOBBY_HOST   -> web (static lobby + /config.json)
#   NETPLAY_HOST -> netplay (socket.io + WebRTC signalling)
# Copy ../.env.example to ../.env and fill it in, then: docker compose up -d --build
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args: { GIT_COMMIT: "${GIT_COMMIT:-}" }   # GIT_COMMIT=$(git rev-parse HEAD) docker compose up -d --build
    environment:
      CSP_MODE: ${CSP_MODE:-report}
      NETPLAY_URL: https://${NETPLAY_HOST}
      PUBLIC_URL: https://${LOBBY_HOST}/
      ICE_SERVERS: ${ICE_SERVERS:-[{"urls":"stun:stun.l.google.com:19302"}]}
      PACKAGED_ROM: ${PACKAGED_ROM:-0}   # roms/ is not in the image; mount it at /app/roms and set 1 to serve it
      STREAM_FPS: ${STREAM_FPS:-60}
      STREAM_BITRATE_DIRECT: ${STREAM_BITRATE_DIRECT:-4000000}
      STREAM_BITRATE_RELAY: ${STREAM_BITRATE_RELAY:-1500000}
      INPUT_DELAY_DEFAULT: ${INPUT_DELAY_DEFAULT:-3}
      THREADS: ${THREADS:-1}
      MAX_SPECTATORS: ${MAX_SPECTATORS:-2}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  netplay:
    build: { context: .., dockerfile: deploy/Dockerfile.netplay }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/list?domain=health&game_id=0"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # TURN relay for players behind strict NATs: docker compose --profile turn up -d
  # Needs host networking for the UDP relay range. Fill TURN_* in ../.env and point
  # ICE_SERVERS at it (see ../.env.example). Long-term credentials: one shared
  # user/password, which /config.json hands to every visitor; use the
  # --use-auth-secret variant (TURN_SECRET) with short-lived credentials if that matters.
  turn:
    image: coturn/coturn:4
    network_mode: host
    command: >
      turnserver -n --log-file=stdout
      --listening-port=${TURN_PORT:-3478}
      --realm=${TURN_REALM:-${NETPLAY_HOST}}
      --external-ip=${TURN_PUBLIC_IP}
      --lt-cred-mech --user=${TURN_USER}:${TURN_PASSWORD}
      --min-port=${TURN_MIN_PORT:-49160} --max-port=${TURN_MAX_PORT:-49200}
      --fingerprint --no-cli --no-tls --no-dtls --no-multicast-peers
    restart: unless-stopped
    profiles: ["turn"]

  bot:
    build: { context: .., dockerfile: deploy/Dockerfile.bot }
    environment:
      FLUXER_BOT_TOKEN: ${FLUXER_BOT_TOKEN:-}
      LOBBY_URL: https://${LOBBY_HOST}/
      FLUXER_INSTANCE: ${FLUXER_INSTANCE:-https://fluxer.app}
    restart: unless-stopped
    profiles: ["fluxer"]

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      LOBBY_HOST: ${LOBBY_HOST}
      NETPLAY_HOST: ${NETPLAY_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
